<?xml version="1.0"?>
<!--
  OpenSCAD snapshot builds ship the Liberation fonts but omit the main fonts.conf,
  so fontconfig fails to initialise and text() silently falls back to a single-stroke
  skeleton font. Those strokes have no width and do not print.

  The server points FONTCONFIG_FILE at this file. Directories that do not exist are
  ignored, so one file covers Windows, macOS and Linux.
-->
<fontconfig>
  <dir>C:/Windows/Fonts</dir>
  <dir prefix="xdg">fonts</dir>
  <dir>~/AppData/Local/Microsoft/Windows/Fonts</dir>

  <dir>/System/Library/Fonts</dir>
  <dir>/Library/Fonts</dir>
  <dir>~/Library/Fonts</dir>

  <dir>/usr/share/fonts</dir>
  <dir>/usr/local/share/fonts</dir>
  <dir>~/.fonts</dir>

  <cachedir prefix="xdg">fontconfig</cachedir>
  <cachedir>~/.fontconfig</cachedir>

  <!-- Give the generic families something real to resolve to. -->
  <match target="pattern">
    <test qual="any" name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="same"><string>Liberation Sans</string></edit>
    <edit name="family" mode="append" binding="same"><string>Arial</string></edit>
    <edit name="family" mode="append" binding="same"><string>DejaVu Sans</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>serif</string></test>
    <edit name="family" mode="prepend" binding="same"><string>Liberation Serif</string></edit>
    <edit name="family" mode="append" binding="same"><string>Times New Roman</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>monospace</string></test>
    <edit name="family" mode="prepend" binding="same"><string>Liberation Mono</string></edit>
    <edit name="family" mode="append" binding="same"><string>Consolas</string></edit>
  </match>
</fontconfig>
