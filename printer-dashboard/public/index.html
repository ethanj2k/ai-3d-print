<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>5M · live</title>
  <link rel="icon" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <script type="importmap">
    { "imports": { "three": "/vendor/three.module.js" } }
  </script>
</head>
<body>
  <div class="progress-rail" id="progress-rail"></div>
  <header class="top">
    <div class="brand">
      <span class="mark" aria-hidden="true"></span>
      <div>
        <div class="name">Adventurer 5M</div>
        <div class="sub" data-field="identity">waiting for printer</div>
      </div>
    </div>
    <div class="modes" id="modes">
      <button type="button" data-mode="print" class="on">Print</button>
      <button type="button" data-mode="preview">Preview</button>
    </div>
    <div class="job-chip" data-field="job">no job</div>
    <div class="state" data-state="offline">
      <span class="dot"></span>
      <span data-field="status">offline</span>
    </div>
  </header>

  <main>
    <section class="stage">
      <canvas id="view"></canvas>
      <div class="hud">
        <div class="hud-layer">
          <span class="k">layer</span>
          <span class="v"><span data-field="layer">—</span><span class="dim"> / </span><span data-field="layers">—</span></span>
        </div>
        <div class="hud-pct" data-field="pct">—</div>
      </div>
      <label class="preview">
        <span class="k">full model <span id="preview-val">0%</span></span>
        <input type="range" id="preview" min="0" max="100" value="0" step="1">
      </label>
      <div class="review" id="review" hidden>
        <div class="review-copy">
          <div class="k">review</div>
          <div class="review-name" id="review-name">design</div>
        </div>
        <div class="review-actions">
          <button type="button" id="review-reject">Revise</button>
          <button type="button" class="go" id="review-approve">Approve print</button>
        </div>
      </div>
      <div class="stage-note" id="stage-note" hidden></div>
    </section>

    <aside class="rail">
      <section class="block times">
        <div>
          <div class="k">elapsed</div>
          <div class="v mono" data-field="elapsed">—</div>
        </div>
        <div>
          <div class="k">remaining</div>
          <div class="v mono" data-field="remaining">—</div>
        </div>
      </section>

      <section class="block temps">
        <div class="temp">
          <div class="temp-head">
            <span class="k">nozzle</span>
            <span class="mono"><span data-field="noz">—</span><span class="dim"> → </span><span data-field="nozTarget">—</span></span>
          </div>
          <div class="bar"><i id="noz-bar"></i></div>
        </div>
        <div class="temp">
          <div class="temp-head">
            <span class="k">bed</span>
            <span class="mono"><span data-field="bed">—</span><span class="dim"> → </span><span data-field="bedTarget">—</span></span>
          </div>
          <div class="bar bed"><i id="bed-bar"></i></div>
        </div>
      </section>

      <section class="block facts">
        <div><span class="k">filament</span><span data-field="filament">—</span></div>
        <div><span class="k">speed</span><span data-field="speed">—</span></div>
        <div><span class="k">cooling fan</span><span data-field="fan">—</span></div>
        <div><span class="k">chamber fan</span><span data-field="chamberFan">—</span></div>
        <div><span class="k">z offset</span><span data-field="zoff">—</span></div>
        <div><span class="k">nozzle</span><span data-field="nozzleModel">—</span></div>
        <div><span class="k">firmware</span><span data-field="fw">—</span></div>
        <div><span class="k">disk</span><span data-field="disk">—</span></div>
      </section>

      <p class="fine">View only. This page never starts, pauses, or cancels a print.</p>
    </aside>
  </main>

  <script type="module" src="/app.js"></script>
</body>
</html>
